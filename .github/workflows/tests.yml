name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Tests (no dependencies, no install step)
        run: npm test
      - name: Workflow is up to date with its sources
        run: node n8n/build_workflow.mjs && git diff --exit-code n8n/workflow.json
